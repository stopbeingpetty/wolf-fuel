<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Revenue Wolves — Meal Planning</title>
<meta name="description" content="Revenue Wolves — Meal Planning. Tjedni planer prehrane.">
<meta name="theme-color" content="#04120B">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Revenue Wolves">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ================= TOKENI ================= */
:root{
  --void:#04120B;
  --void2:#030D08;
  --card:#0A2114;
  --card2:#0D2A1A;
  --hair:rgba(241,245,236,.09);
  --hair2:rgba(241,245,236,.16);
  --gold:#FDD264;
  --gold2:#E7B94A;
  --parch:#FEF9CA;
  --gold-h:rgba(253,210,100,.30);
  --gold-hd:rgba(253,210,100,.16);
  --field:#2FBF55;
  --txt:#F1F5EC;
  --txt2:rgba(241,245,236,.64);
  --txt3:rgba(241,245,236,.40);
  --danger:#F0876C;
  --cat-d:#FDD264;
  --cat-r:#2FBF55;
  --cat-v:#BBD9C4;
  --r:18px;
  --topbar-h:64px;
  --tab-h:66px;
  --serif:'Marcellus',Georgia,'Times New Roman',serif;
  --sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--sans);
  font-size:15px;line-height:1.45;
  color:var(--txt);
  background:var(--void);
  min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 520px at 50% -160px, rgba(253,210,100,.055), transparent 62%),
    radial-gradient(1100px 700px at 108% 8%, rgba(47,191,85,.06), transparent 58%),
    linear-gradient(180deg,#0A2114 0%, var(--void) 42%, var(--void2) 100%);
}
img,svg{display:block;max-width:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:inherit}
input,select,textarea{font:inherit;color:var(--txt);-webkit-appearance:none;appearance:none}
::selection{background:rgba(253,210,100,.30)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.ic{width:21px;height:21px;flex:none}
.num{font-family:var(--serif);letter-spacing:.02em}
.mark{display:block}
.mark use{pointer-events:none}

/* ================= UKRASI: pravilo menija ================= */
.rule{display:flex;align-items:center;gap:10px;margin:12px 0 20px;color:var(--gold)}
.rule::before,.rule::after{content:'';height:1px;flex:1}
.rule::before{background:linear-gradient(90deg,transparent,var(--gold-h))}
.rule::after{background:linear-gradient(90deg,var(--gold-h),transparent)}
.rule i{width:5px;height:5px;flex:none;transform:rotate(45deg);border:1px solid var(--gold2);background:rgba(253,210,100,.18)}
.dm{width:5px;height:5px;flex:none;transform:rotate(45deg);background:var(--gold2);opacity:.75;border-radius:1px}
.lead{flex:1;min-width:14px;margin:0 10px;border-bottom:1px dotted rgba(253,210,100,.30);transform:translateY(-4px)}

/* ================= SPLASH ================= */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#0A2114,var(--void) 70%);transition:opacity .5s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash .mark{width:104px;height:122px;filter:drop-shadow(0 14px 34px rgba(0,0,0,.55))}
#splash .wm{margin-top:20px;font-family:var(--serif);font-size:21px;letter-spacing:.3em;text-indent:.3em;color:var(--parch)}
#splash .sub{margin-top:9px;font-size:10px;font-weight:700;letter-spacing:.42em;text-indent:.42em;color:var(--gold);text-transform:uppercase}
#splash .rule{width:190px;margin:18px 0 0}

/* ================= TOPBAR ================= */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:12px;
  height:calc(var(--topbar-h) + env(safe-area-inset-top));
  padding:env(safe-area-inset-top) 16px 0;
  background:rgba(5,17,11,.86);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--hair);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brand .mark{width:30px;height:36px;flex:none}
.brand .bt{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .wm{font-family:var(--serif);font-size:13.5px;letter-spacing:.20em;color:var(--parch);white-space:nowrap;line-height:1}
.brand .sub{font-size:8.5px;font-weight:700;letter-spacing:.34em;color:var(--gold);text-transform:uppercase;line-height:1;white-space:nowrap}
.topnav{display:none;position:absolute;left:50%;transform:translateX(-50%);gap:8px}
.topnav button{position:relative;padding:10px 16px;font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3);transition:color .15s}
.topnav button::after{content:'';position:absolute;left:16px;right:16px;bottom:4px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .2s ease}
.topnav button:hover{color:var(--txt2)}
.topnav button.on{color:var(--parch)}
.topnav button.on::after{transform:scaleX(1)}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
#syncPill{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--hair);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);white-space:nowrap;transition:border-color .2s,color .2s}
#syncPill .dot{width:6px;height:6px;border-radius:50%;background:var(--txt3);flex:none;transition:background .2s}
#syncPill.ok{color:var(--txt2);border-color:rgba(47,191,85,.35)}
#syncPill.ok .dot{background:var(--field);box-shadow:0 0 10px rgba(47,191,85,.9)}
#syncPill.saving .dot{background:var(--gold);animation:pulse 1.1s infinite}
#syncPill.err{color:var(--danger);border-color:rgba(240,135,108,.4)}
#syncPill.err .dot{background:var(--danger)}
@keyframes pulse{50%{opacity:.25}}
.iconbtn{display:flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:12px;color:var(--txt2);transition:background .15s,color .15s}
.iconbtn:hover{background:rgba(255,255,255,.05);color:var(--txt)}

/* ================= RASPORED ================= */
main{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:22px 16px calc(var(--tab-h) + env(safe-area-inset-bottom) + 30px)}
.view-h{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.view-h h1{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:.02em;color:var(--parch);line-height:1.15}
.view-h .wk-nav{display:flex;align-items:center;gap:6px;margin-left:auto}
.wk-nav .iconbtn{width:38px;height:38px;border:1px solid var(--hair)}
.wk-nav .iconbtn:hover{border-color:var(--hair2)}
.chip-today{padding:8px 14px;border-radius:999px;border:1px solid var(--gold-h);color:var(--gold);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.chip-today:hover{background:rgba(253,210,100,.08)}

/* ================= TJEDAN ================= */
.week{display:flex;flex-direction:column;gap:14px}
.day{
  background:linear-gradient(180deg,var(--card2),var(--card) 68%);
  border:1px solid var(--hair);border-radius:var(--r);
  padding:15px 18px 8px;position:relative;overflow:hidden;
  scroll-margin-top:calc(var(--topbar-h) + env(safe-area-inset-top) + 14px);
}
.anim .day{animation:rise .5s cubic-bezier(.2,.8,.25,1) both}
.anim .day:nth-child(2){animation-delay:.04s}.anim .day:nth-child(3){animation-delay:.08s}
.anim .day:nth-child(4){animation-delay:.12s}.anim .day:nth-child(5){animation-delay:.16s}
.anim .day:nth-child(6){animation-delay:.20s}.anim .day:nth-child(7){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.day.past{opacity:.62}
.day.today{
  border-color:var(--gold-hd);
  background:linear-gradient(180deg,rgba(253,210,100,.05),var(--card2) 30%,var(--card) 80%);
  box-shadow:0 18px 44px rgba(0,0,0,.36);
}
.day.today::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:linear-gradient(180deg,var(--parch),var(--gold) 45%,rgba(231,185,74,.15))}
.daymark{position:absolute;right:-34px;top:-14px;width:168px;height:198px;opacity:.05;pointer-events:none}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;position:relative}
.day-h .dn{font-size:12px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--txt2)}
.day.today .day-h .dn{color:var(--parch)}
.day-h .dd{font-family:var(--serif);font-size:13.5px;color:var(--txt3)}
.pill-today{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.26em;text-indent:.26em;color:var(--gold);border:1px solid var(--gold-h);padding:5px 9px 4px;border-radius:6px;text-transform:uppercase}
.slots{display:flex;flex-direction:column}
.slot{padding:11px 0 12px;cursor:pointer;position:relative;transition:background .15s;border-radius:10px}
.slot + .slot{border-top:1px dotted var(--hair)}
.slot:hover{background:rgba(255,255,255,.022)}
.slot:active{background:rgba(255,255,255,.04)}
.slot-h{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.tick{width:6px;height:12px;border-radius:2px;transform:skewX(-14deg);flex:none}
.t-d{background:var(--cat-d)}.t-r{background:var(--cat-r)}.t-v{background:var(--cat-v)}
.slot-h .sl{font-size:10.5px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:var(--txt3)}
.slot-h .ic{width:14px;height:14px;color:var(--txt3);margin-left:auto;opacity:.7}
.entries{display:flex;flex-direction:column}
.entry{display:flex;align-items:center;gap:10px;min-height:34px;padding:2px 0}
.entry .nm{font-size:15px;font-weight:500;color:var(--txt);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .x{margin-left:auto;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;color:var(--txt3);opacity:.55;flex:none;transition:opacity .15s,color .15s,background .15s}
.entry .x svg{width:13px;height:13px}
.entry:hover .x{opacity:1}
.entry .x:hover{color:var(--danger);background:rgba(240,135,108,.10)}
.empty-add{display:flex;align-items:center;gap:9px;color:var(--txt3);font-size:14px;min-height:32px}
.empty-add .plus{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px dashed rgba(241,245,236,.26);border-radius:7px}
.empty-add .plus svg{width:12px;height:12px}
.slot:hover .empty-add{color:var(--txt2)}

/* ================= SHEET ================= */
#sheet{position:fixed;inset:0;z-index:60;display:none}
#sheet.open{display:block}
#sheet .bg{position:absolute;inset:0;background:rgba(2,8,5,.66);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transition:opacity .25s}
#sheet.in .bg{opacity:1}
.panel{
  position:absolute;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,#0E2C1B,#0A2013 60%);
  border:1px solid var(--gold-hd);border-bottom:0;
  border-radius:24px 24px 0 0;
  max-height:calc(88dvh);
  display:flex;flex-direction:column;
  transform:translateY(48px);opacity:0;
  transition:transform .34s cubic-bezier(.2,1.05,.3,1),opacity .26s;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -22px 70px rgba(0,0,0,.6);
}
#sheet.in .panel{transform:translateY(0);opacity:1}
.grab{width:38px;height:4px;border-radius:99px;background:rgba(241,245,236,.20);margin:10px auto 2px;flex:none}
.p-head{display:flex;align-items:center;gap:11px;padding:10px 20px 12px;flex:none}
.p-head .tt{min-width:0}
.p-head h2{font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:.02em;color:var(--parch)}
.p-head .sub{color:var(--txt3);font-size:12.5px;margin-top:2px}
.p-head .iconbtn{margin-left:auto}
.p-head .tick{width:7px;height:15px}
.p-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 20px 18px;flex:1 1 auto;min-height:0}
.p-foot{flex:none;display:flex;gap:10px;padding:12px 20px 14px;border-top:1px solid var(--hair)}

/* ================= BRZI UNOS ================= */
.qa{position:relative;margin-bottom:16px}
.qa .inp{padding:14px 46px 14px 16px;font-family:var(--serif);font-size:17px;letter-spacing:.01em;border-color:var(--gold-hd);background:rgba(0,0,0,.28)}
.qa .inp:focus{border-color:var(--gold)}
.qa .ret{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--txt3);width:20px;height:20px;pointer-events:none}
.qa-hint{font-size:12px;color:var(--txt3);margin:-8px 2px 14px;line-height:1.5}
.qa-hint b{color:var(--txt2);font-weight:600}
.grp{margin-bottom:18px}
.grp-l{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin-bottom:4px}
.grp-l .tick{width:5px;height:10px}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;min-height:48px;padding:6px 2px;border-bottom:1px dotted var(--hair);transition:background .12s;width:100%}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(255,255,255,.022)}
.row .ck{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:1px solid var(--hair2);border-radius:7px;flex:none;color:transparent;transition:all .15s}
.row .ck svg{width:12px;height:12px}
.row.on .ck{background:linear-gradient(180deg,var(--parch),var(--gold));border-color:var(--gold);color:#3A2C08}
.row .nm{font-size:15px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on .nm{color:var(--parch)}
.row .cattag{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-weight:700;letter-spacing:.16em;color:var(--txt3);text-transform:uppercase;flex:none}
.row .cattag .tick{width:4px;height:9px}
.row .ct{font-family:var(--serif);font-size:13.5px;color:var(--txt3);flex:none}
.row.create{border:1px solid var(--gold-hd);border-radius:13px;background:rgba(253,210,100,.05);padding:10px 14px;margin-bottom:12px}
.row.create:hover{background:rgba(253,210,100,.09)}
.row.create .plus{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;background:linear-gradient(180deg,var(--parch),var(--gold));color:#3A2C08;flex:none}
.row.create .plus svg{width:14px;height:14px}
.row.create .mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.row.create .nm{color:var(--parch);white-space:normal}
.row.create .sub{font-size:11.5px;color:var(--txt3);margin-top:1px}
.nores{color:var(--txt3);font-size:13.5px;padding:10px 2px}

/* ================= GUMBI I FORME ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:13px;font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;transition:transform .12s,filter .15s,background .15s}
.btn:active{transform:scale(.97)}
.btn-p{color:#2B1F05;background:linear-gradient(180deg,var(--parch),var(--gold) 58%,var(--gold2));box-shadow:0 8px 24px rgba(253,210,100,.18)}
.btn-p:hover{filter:brightness(1.04)}
.btn-g{border:1px solid var(--hair2);color:var(--txt2)}
.btn-g:hover{color:var(--txt);border-color:rgba(241,245,236,.3)}
.btn-d{border:1px solid rgba(240,135,108,.4);color:var(--danger)}
.btn-d:hover{background:rgba(240,135,108,.08)}
.grow{flex:1}
.field{margin-bottom:15px}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--txt3);margin-bottom:8px}
.inp{width:100%;min-height:48px;padding:12px 15px;border-radius:13px;border:1px solid var(--hair2);background:rgba(0,0,0,.26);font-size:16px;transition:border-color .15s}
.inp::placeholder{color:var(--txt3)}
.inp:focus{outline:none;border-color:var(--gold)}
.hint{font-size:12.5px;color:var(--txt3);margin-top:8px;line-height:1.55}
.hint b{color:var(--txt2);font-weight:600}
.seg{display:flex;border:1px solid var(--hair2);border-radius:12px;overflow:hidden}
.seg button{padding:9px 17px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--txt3)}
.seg button.on{color:#2B1F05;background:linear-gradient(180deg,var(--parch),var(--gold))}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pills button{padding:10px 15px;border-radius:12px;border:1px solid var(--hair2);font-size:13.5px;font-weight:600;color:var(--txt2);display:flex;align-items:center;gap:8px}
.pills button.on{border-color:var(--gold);color:var(--gold);background:rgba(253,210,100,.07)}
.setrow{display:flex;gap:10px;flex-wrap:wrap}
.set-sec{margin-bottom:26px}
.set-sec h3{font-family:var(--serif);font-weight:400;font-size:17px;color:var(--parch);letter-spacing:.02em;margin-bottom:12px}
.status-line{font-size:13.5px;color:var(--txt2);border:1px solid var(--hair);border-radius:12px;padding:11px 14px;margin-bottom:14px;line-height:1.5}
.status-line b{color:var(--parch);font-weight:600}

/* ================= JELA ================= */
.lib-sec{margin-top:26px}
.lrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 2px;min-height:56px;border-bottom:1px dotted var(--hair);transition:background .12s}
.lrow:hover{background:rgba(255,255,255,.02)}
.lrow .mid{min-width:0;display:flex;flex-direction:column;gap:2px}
.lrow .nm{font-size:15.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .tags{font-size:12px;color:var(--txt3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .st{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none}
.lrow .c{font-family:var(--serif);font-size:15.5px;color:var(--gold)}
.lrow .l{font-size:10.5px;color:var(--txt3);letter-spacing:.04em}
.lrow .chev{width:16px;height:16px;color:var(--txt3);flex:none}
.lrow.arch{opacity:.55}
.restore{flex:none;padding:8px 13px;border:1px solid var(--hair2);border-radius:10px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt2)}
.restore:hover{color:var(--gold);border-color:var(--gold-h)}
.arch-t{display:flex;align-items:center;gap:8px;color:var(--txt3);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;padding:10px 0}
.arch-t .chev{width:14px;height:14px;transition:transform .2s}
.arch-t.open .chev{transform:rotate(90deg)}
.arch-list{display:none}
.arch-list.open{display:block}
.empty-view{color:var(--txt3);text-align:center;padding:60px 20px;font-size:14.5px;line-height:1.7}

/* ================= STATISTIKA ================= */
.stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:8px}
.scard{border:1px solid var(--hair);border-radius:15px;padding:14px 14px 13px;background:linear-gradient(180deg,var(--card2),var(--card));display:flex;flex-direction:column;gap:3px;min-width:0}
.scard.gold{border-color:var(--gold-hd);background:linear-gradient(180deg,rgba(253,210,100,.06),var(--card))}
.scard .lab{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--txt3)}
.scard .big{font-family:var(--serif);font-size:27px;color:var(--parch);line-height:1.05;margin-top:3px}
.scard .big small{font-size:14px;color:var(--txt3)}
.scard.gold .big{color:var(--gold)}
.scard .sub2{font-size:11px;color:var(--txt3);line-height:1.45;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mini-track{height:2px;border-radius:99px;background:rgba(241,245,236,.10);margin-top:9px;overflow:hidden}
.mini-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold2),var(--parch));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.stat-sec{margin-top:28px}
.stat-sec h3{display:flex;align-items:center;gap:9px;font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.02em;color:var(--parch);margin-bottom:6px}
.stat-sec h3 .tick{width:6px;height:12px}
.brow{display:flex;align-items:center;gap:11px;padding:10px 2px 11px;border-bottom:1px dotted var(--hair)}
.brow:last-child{border-bottom:0}
.brow .mid{flex:1;min-width:0}
.brow .top{display:flex;align-items:baseline}
.brow .nm{font-size:14.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .ct{font-family:var(--serif);font-size:14.5px;color:var(--gold);flex:none}
.bar{height:3px;border-radius:99px;background:rgba(241,245,236,.08);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,rgba(231,185,74,.55),var(--gold));transition:width .8s cubic-bezier(.2,.8,.2,1)}
.brow .last{font-size:10.5px;color:var(--txt3);margin-top:6px;letter-spacing:.04em}
.oldrow{display:flex;align-items:center;padding:11px 2px;border-bottom:1px dotted var(--hair);font-size:14.5px}
.oldrow:last-child{border-bottom:0}
.oldrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.oldrow .ago{color:var(--txt3);font-size:12.5px;flex:none}
.stat-empty{color:var(--txt3);font-size:13.5px;padding:14px 2px;line-height:1.65}

/* ================= TABBAR ================= */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:flex;justify-content:space-around;align-items:stretch;
  height:calc(var(--tab-h) + env(safe-area-inset-bottom));
  padding:0 8px env(safe-area-inset-bottom);
  background:rgba(5,16,10,.90);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--hair);
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--txt3);position:relative;transition:color .15s}
.tab svg{width:22px;height:22px}
.tab span{font-size:9.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
.tab.on{color:var(--gold)}
.tab.on::before{content:'';position:absolute;top:0;left:26%;right:26%;height:2px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}

/* ================= DOBRODOŠLICA / TOAST ================= */
#welcome{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,8,5,.78);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#welcome.open{display:flex}
.wel{max-width:430px;width:100%;background:linear-gradient(180deg,#0E2C1B,#0A2013);border:1px solid var(--gold-hd);border-radius:22px;padding:34px 28px 26px;text-align:center;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.wel .mark{width:76px;height:90px;margin:0 auto}
.wel h2{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:.04em;color:var(--parch);margin-top:16px}
.wel .rule{width:170px;margin:14px auto 18px}
.wel p{font-size:13.5px;color:var(--txt2);line-height:1.65;margin-bottom:11px;text-align:left}
.wel p b{color:var(--parch);font-weight:600}
.wel .btn{margin-top:12px;width:100%}
#toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
  transform:translateX(-50%) translateY(14px);z-index:90;
  background:#0F2E1C;border:1px solid var(--gold-hd);border-radius:12px;
  padding:11px 18px;font-size:13.5px;font-weight:600;color:var(--txt);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  max-width:calc(100vw - 40px);text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.5);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ================= ABOUT ================= */
.about-card{border:1px solid var(--hair);border-radius:16px;padding:26px 20px 22px;text-align:center;background:linear-gradient(180deg,var(--card2),var(--card))}
.about-card .mark{width:56px;height:66px;margin:0 auto 12px}
.about-card .n{font-family:var(--serif);font-size:16px;letter-spacing:.26em;text-indent:.26em;color:var(--parch)}
.about-card .s{font-size:9px;font-weight:700;letter-spacing:.36em;text-indent:.36em;color:var(--gold);text-transform:uppercase;margin-top:6px}
.about-card .v{font-size:11.5px;color:var(--txt3);margin-top:10px}

/* ================= DESKTOP ================= */
@media(min-width:760px){
  .stat-cards{gap:14px}
  .scard{padding:18px 18px 16px}
  .scard .big{font-size:32px}
  .panel{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-46%) scale(.98);width:min(560px,calc(100vw - 48px));max-height:min(86vh,780px);border-radius:22px;border-bottom:1px solid var(--gold-hd)}
  #sheet.in .panel{transform:translate(-50%,-50%) scale(1)}
  .grab{display:none}
  .p-head{padding-top:20px}
}
@media(min-width:1000px){
  .topnav{display:flex}
  .tabbar{display:none}
  main{padding:28px 28px 60px}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;align-items:stretch}
  .day{padding:14px 14px 8px;display:flex;flex-direction:column}
  .day .slots{flex:1;display:flex;flex-direction:column}
  .day .slot{flex:1}
  .day-h{flex-wrap:wrap;row-gap:4px}
  .entry .nm{font-size:13.5px;white-space:normal;line-height:1.35}
  .entry .x{opacity:0}
  .entry:hover .x{opacity:1}
  .empty-add{font-size:12.5px}
  .empty-add span:last-child{display:none}
  .view-h h1{font-size:28px}
  .pill-today{letter-spacing:.2em;text-indent:.2em;padding:4px 7px 3px;font-size:8.5px}
  .daymark{right:-46px;width:150px}
}
@media(min-width:1240px){
  .day{padding:16px 17px 10px}
  .entry .nm{font-size:14px}
  .empty-add span:last-child{display:inline}
}
@media(max-width:390px){
  .brand .wm{font-size:12px;letter-spacing:.16em}
  .scard .big{font-size:23px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>

<script>
'use strict';
/* =================================================================
   REVENUE WOLVES — Meal Planning
   Podaci: localStorage + (opcionalno) GitHub repozitorij kao baza
   Shema podataka identična v1 (Wolf Fuel) — ništa se ne gubi.
   ================================================================= */

var BRAND = { name:'REVENUE WOLVES', sub:'Meal Planning', ver:'2.0' };

/* ---------- pomoćne ---------- */
function $(s,el){ return (el||document).querySelector(s); }
function $$(s,el){ return Array.prototype.slice.call((el||document).querySelectorAll(s)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ try{ if(crypto.randomUUID) return crypto.randomUUID(); }catch(e){} return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,9); }
function norm(s){ try{ return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }catch(e){ return String(s).toLowerCase(); } }
function normEq(a,b){ return norm(String(a).trim())===norm(String(b).trim()); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* ---------- datumi (hr) ---------- */
var DAYS = ['ned','pon','uto','sri','čet','pet','sub'];
var MONTHS_G = ['siječnja','veljače','ožujka','travnja','svibnja','lipnja','srpnja','kolovoza','rujna','listopada','studenoga','prosinca'];
function pad2(n){ return String(n).padStart(2,'0'); }
function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fromIso(s){ var p=s.split('-'); return new Date(+p[0], +p[1]-1, +p[2], 12); }
function addD(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function todayD(){ var t=new Date(); t.setHours(12,0,0,0); return t; }
function weekStartOf(d){ return addD(d, -((d.getDay()+6)%7)); }
function diffDays(aIso,bIso){ return Math.round((fromIso(aIso)-fromIso(bIso))/864e5); }
function fmtShort(d){ return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+'.'; }
function fmtHuman(dIso){ var d=fromIso(dIso); return DAYS[d.getDay()]+', '+d.getDate()+'. '+MONTHS_G[d.getMonth()]; }
function weekRangeLabel(ws){
  var we=addD(ws,6);
  if(ws.getMonth()===we.getMonth()) return ws.getDate()+'. – '+we.getDate()+'. '+MONTHS_G[ws.getMonth()]+' '+we.getFullYear()+'.';
  return ws.getDate()+'. '+MONTHS_G[ws.getMonth()]+' – '+we.getDate()+'. '+MONTHS_G[we.getMonth()]+' '+we.getFullYear()+'.';
}
function relDays(lastIso, todayIso){
  if(!lastIso) return 'nikad';
  var n=diffDays(todayIso,lastIso);
  if(n<=0) return 'danas';
  if(n===1) return 'jučer';
  return 'prije '+n+' d';
}

/* ---------- stanje ---------- */
var SLOTS=[ {k:'d',name:'Doručak'}, {k:'r',name:'Ručak'}, {k:'v',name:'Večera'} ];
var SLOT_NAME={d:'Doručak',r:'Ručak',v:'Večera'};
var LS_STATE='wf.state', LS_CFG='wf.cfg', LS_UI='wf.ui';

var state=null, cfg=null, ui=null;
var curView='week';
var weekStart=weekStartOf(todayD());
var scrollToTodayFlag=true;

function freshState(){ return { version:1, updatedAt:Date.now(), meals:[], plan:{}, meta:{seeded:false} }; }

function loadAll(){
  try{ state=JSON.parse(lsGet(LS_STATE)||'null'); }catch(e){ state=null; }
  if(!state||typeof state!=='object'||!Array.isArray(state.meals)) state=freshState();
  if(!state.plan) state.plan={};
  if(!state.meta) state.meta={};
  try{ cfg=JSON.parse(lsGet(LS_CFG)||'null'); }catch(e){ cfg=null; }
  try{ ui=JSON.parse(lsGet(LS_UI)||'null')||{}; }catch(e){ ui={}; }
  if(!ui.statsWin) ui.statsWin=30;
  maybeSeed();
}
function saveLocal(){ lsSet(LS_STATE, JSON.stringify(state)); }
function saveUi(){ lsSet(LS_UI, JSON.stringify(ui)); }
function saveCfg(){ if(cfg) lsSet(LS_CFG, JSON.stringify(cfg)); else lsDel(LS_CFG); }

function maybeSeed(){
  if(state.meta.seeded || state.meals.length) return;
  var seed=[
    ['Jaja + sir + panceta','d',['jaja','sir','panceta']],
    ['Jaja + sir + pršut','d',['jaja','sir','pršut']],
    ['Overnight oats','d',['zob']],
    ['Kefir sa sjemenkama','d',['kefir','sjemenke']],
    ['Kruh s avokadom','d',['kruh','avokado']],
    ['Mamin ručak','r',[]]
  ];
  seed.forEach(function(s){ state.meals.push({id:uid(),name:s[0],cat:s[1],tags:s[2],created:Date.now()}); });
  state.meta.seeded=true;
  saveLocal();
}

function mealById(id){ for(var i=0;i<state.meals.length;i++) if(state.meals[i].id===id) return state.meals[i]; return null; }
function dayPlan(dIso){ var p=state.plan[dIso]; return p||{d:[],r:[],v:[]}; }
function ensureDay(dIso){ if(!state.plan[dIso]) state.plan[dIso]={d:[],r:[],v:[]}; var p=state.plan[dIso]; ['d','r','v'].forEach(function(k){ if(!Array.isArray(p[k])) p[k]=[]; }); return p; }
function pruneDay(dIso){ var p=state.plan[dIso]; if(p && !p.d.length && !p.r.length && !p.v.length) delete state.plan[dIso]; }

function touch(){ state.updatedAt=Date.now(); saveLocal(); scheduleSync(); }

/* ---------- statistika ---------- */
function occurrences(){
  var list=[];
  for(var dIso in state.plan){ var p=state.plan[dIso];
    ['d','r','v'].forEach(function(k){ (p[k]||[]).forEach(function(id){ list.push({date:dIso,slot:k,id:id}); }); });
  }
  return list;
}
function statsFor(winDays){
  var tIso=iso(todayD());
  var byMeal={}, byTag={}, last={}, uniq={}, occ=occurrences();
  occ.forEach(function(o){
    if(o.date>tIso) return;
    var dd=diffDays(tIso,o.date);
    if(!last[o.id] || o.date>last[o.id]) last[o.id]=o.date;
    if(dd<winDays){
      byMeal[o.id]=(byMeal[o.id]||0)+1; uniq[o.id]=1;
      var m=mealById(o.id);
      if(m&&m.tags) m.tags.forEach(function(t){ t=norm(String(t).trim()); if(t) byTag[t]=(byTag[t]||0)+1; });
    }
  });
  return { byMeal:byMeal, byTag:byTag, last:last, unique:Object.keys(uniq).length, todayIso:tIso };
}
function weekFill(ws){
  var f=0;
  for(var i=0;i<7;i++){ var p=dayPlan(iso(addD(ws,i))); ['d','r','v'].forEach(function(k){ if(p[k]&&p[k].length) f++; }); }
  return f;
}

/* ---------- namirnice iz naziva ---------- */
function parseTags(name){
  var parts=String(name||'').split(/[+,]/).map(function(t){ return t.trim(); }).filter(Boolean);
  return parts.length>1 ? parts.slice(0,12) : [];
}

/* ---------- SVG ikone ---------- */
var I={
  sunrise:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M3.5 17.5h17M7 14.5a5 5 0 0 1 10 0"/><path d="M12 3.5v3.4M5.6 6.4l1.9 1.9M18.4 6.4l-1.9 1.9"/></svg>',
  sun:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.3M12 18.9v2.3M2.8 12h2.3M18.9 12h2.3M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"/></svg>',
  moon:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 13.4A8.5 8.5 0 1 1 10.6 3.6a6.8 6.8 0 0 0 9.8 9.8Z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 12.8l4.6 4.7L19.5 6.5"/></svg>',
  left:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5 8 12l6.5 7"/></svg>',
  right:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5 16 12l-6.5 7"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5 16 12l-6.5 7"/></svg>',
  dots:'<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
  ret:'<svg class="ret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 6v5a3 3 0 0 1-3 3H5.5"/><path d="m9 10-4 4 4 4"/></svg>'
};
var MARK='<use href="#rwmark" xlink:href="#rwmark"/>';
function markSvg(cls){ return '<svg class="'+cls+'" viewBox="186.08 0 485.63 572.77" aria-hidden="true">'+MARK+'</svg>'; }
function slotIcon(k){ return k==='d'?I.sunrise:(k==='r'?I.sun:I.moon); }
function ruleHtml(){ return '<div class="rule" aria-hidden="true"><i></i></div>'; }

/* ---------- render router ---------- */
function rerender(keepScroll){
  var y=keepScroll?window.scrollY:0;
  var host=$('#view');
  host.classList.toggle('anim', !keepScroll);
  if(curView==='week') host.innerHTML=renderWeek();
  else if(curView==='lib') host.innerHTML=renderLib();
  else host.innerHTML=renderStats();
  syncNavUi();
  if(keepScroll){ try{ window.scrollTo(0,y); }catch(e){} }
  afterRender();
}
function syncNavUi(){
  $$('#tabbar .tab').forEach(function(b){ b.classList.toggle('on', b.dataset.v===curView); });
  $$('#topnav button').forEach(function(b){ b.classList.toggle('on', b.dataset.v===curView); });
}
function showView(v){
  curView=v; ui.view=v; saveUi();
  if(v==='week') scrollToTodayFlag=false;
  rerender(false);
  try{ window.scrollTo(0,0); }catch(e){}
}
function afterRender(){
  requestAnimationFrame(function(){
    $$('.bar i,.mini-fill').forEach(function(el){ el.style.width=(el.dataset.w||0)+'%'; });
    if(curView==='week' && scrollToTodayFlag){
      scrollToTodayFlag=false;
      var t=$('.day.today');
      if(t && window.innerWidth<1000){ try{ t.scrollIntoView({block:'start'}); }catch(e){} }
    }
  });
}

/* ---------- TJEDAN ---------- */
function renderWeek(){
  var tIso=iso(todayD());
  var onCurrent = iso(weekStart)===iso(weekStartOf(todayD()));
  var h='';
  h+='<div class="view-h">';
  h+='<h1>'+esc(weekRangeLabel(weekStart))+'</h1>';
  h+='<div class="wk-nav">';
  if(!onCurrent) h+='<button class="chip-today" data-act="wk-today">Danas</button>';
  h+='<button class="iconbtn" data-act="wk-prev" aria-label="Prethodni tjedan">'+I.left+'</button>';
  h+='<button class="iconbtn" data-act="wk-next" aria-label="Sljedeći tjedan">'+I.right+'</button>';
  h+='<button class="iconbtn" data-act="wk-menu" aria-label="Više opcija">'+I.dots+'</button>';
  h+='</div></div>';
  h+=ruleHtml();
  h+='<div class="week">';
  for(var i=0;i<7;i++){
    var d=addD(weekStart,i), dIso=iso(d), p=dayPlan(dIso);
    var isToday=dIso===tIso;
    var cls='day'+(isToday?' today':(dIso<tIso?' past':''));
    h+='<section class="'+cls+'">';
    if(isToday) h+=markSvg('daymark');
    h+='<header class="day-h"><span class="dn">'+DAYS[d.getDay()]+'</span><span class="dd num">'+fmtShort(d)+'</span>';
    if(isToday) h+='<span class="pill-today">Danas</span>';
    h+='</header><div class="slots">';
    SLOTS.forEach(function(s){
      var items=p[s.k]||[];
      h+='<div class="slot" data-act="slot" data-date="'+dIso+'" data-slot="'+s.k+'" role="button" tabindex="0" aria-label="'+s.name+', '+esc(fmtHuman(dIso))+'">';
      h+='<div class="slot-h"><i class="tick t-'+s.k+'"></i><span class="sl">'+s.name+'</span>'+slotIcon(s.k)+'</div>';
      if(items.length){
        h+='<div class="entries">';
        items.forEach(function(id){
          var m=mealById(id); if(!m) return;
          h+='<div class="entry"><i class="dm"></i><span class="nm">'+esc(m.name)+'</span>'
            +'<button class="x" data-act="entry-x" data-date="'+dIso+'" data-slot="'+s.k+'" data-id="'+m.id+'" aria-label="Ukloni '+esc(m.name)+'">'+I.x+'</button></div>';
        });
        h+='</div>';
      } else {
        h+='<div class="empty-add"><span class="plus">'+I.plus+'</span><span>Dodaj jelo</span></div>';
      }
      h+='</div>';
    });
    h+='</div></section>';
  }
  h+='</div>';
  return h;
}

/* ---------- SHEET ---------- */
var sheetOpenFlag=false;
function kbFit(){
  try{
    var p=$('#panel'); if(!p||!sheetOpenFlag) return;
    if(window.visualViewport && window.innerWidth<760){

function pickerHtml(){

function qaHintHtml(){
  var t=parseTags(qa.q);
  if(t.length) return 'Namirnice: <b>'+esc(t.join(' · '))+'</b> — statistika ih prati zasebno.';
  return 'Upiši i potvrdi — jelo se sprema u rubriku <b>'+SLOT_NAME[qa.slot]+'</b>. Znak + odvaja namirnice.';
}
function findExact(q){
  var qn=norm(String(q).trim());
  if(!qn) return null;
  for(var i=0;i<state.meals.length;i++){
    var m=state.meals[i];
    if(!m.archived && norm(m.name)===qn) return m;
  }
  return null;
}
function matchMeals(qRaw){
  var q=norm(String(qRaw).trim());
  var toks=q.split(/\s+/).filter(Boolean);
  var st=statsFor(30);
  var res=[];
  state.meals.forEach(function(m){
    if(m.archived) return;
    var name=norm(m.name);
    var hay=name+' '+(m.tags||[]).map(norm).join(' ');
    var s=-1;
    if(name===q) s=0;
    else if(name.indexOf(q)===0) s=1;
    else if(name.indexOf(q)>=0) s=2;
    else if(toks.length && toks.every(function(t){ return hay.indexOf(t)>=0; })) s=3;
    if(s<0) return;
    if(m.cat!==qa.slot) s+=0.5;
    res.push({m:m,s:s});
  });
  res.sort(function(a,b){ return a.s-b.s || (st.byMeal[b.m.id]||0)-(st.byMeal[a.m.id]||0) || a.m.name.localeCompare(b.m.name,'hr'); });
  return res.map(function(r){ return r.m; });
}
function qaRow(m, st, sel){
  var on=sel.indexOf(m.id)>=0;
  var c=st.byMeal[m.id]||0;
  var h='<button class="row'+(on?' on':'')+'" data-act="qa-t" data-id="'+m.id+'">';
  h+='<span class="ck">'+I.check+'</span>';
  h+='<span class="nm">'+esc(m.name)+'</span>';
  if(m.cat!==qa.slot) h+='<span class="cattag"><i class="tick t-'+m.cat+'"></i>'+SLOT_NAME[m.cat]+'</span>';
  if(c>0) h+='<span class="lead"></span><span class="ct num">'+c+'×</span>';
  h+='</button>';
  return h;
}
function qaListHtml(){
  var sel=dayPlan(qa.date)[qa.slot]||[];
  var st=statsFor(30);
  var q=String(qa.q||'').trim();
  var h='';
  if(q){
    var exact=findExact(q);
    if(!exact){
      h+='<button class="row create" data-act="qa-create">'
        +'<span class="plus">'+I.plus+'</span>'
        +'<span class="mid"><span class="nm">Dodaj „'+esc(q)+'”</span>'
        +'<span class="sub">Novo jelo · rubrika '+SLOT_NAME[qa.slot]+'</span></span>'
        +'</button>';
    }
    var ms=matchMeals(q).slice(0,12);
    if(ms.length){
      h+='<div class="grp"><div class="grp-l">Iz tvog menija</div><div class="rows">'+ms.map(function(m){ return qaRow(m,st,sel); }).join('')+'</div></div>';
    } else if(exact){
      h+='<div class="grp"><div class="rows">'+qaRow(exact,st,sel)+'</div></div>';
    }
  } else {
    var selMeals=sel.map(mealById).filter(Boolean);
    if(selMeals.length){
      h+='<div class="grp"><div class="grp-l"><i class="tick t-'+qa.slot+'"></i>U planu</div><div class="rows">'
        +selMeals.map(function(m){ return qaRow(m,st,sel); }).join('')+'</div></div>';
    }
    var active=state.meals.filter(function(m){ return !m.archived; });
    function srt(a,b){ var ca=st.byMeal[a.id]||0, cb=st.byMeal[b.id]||0; if(cb!==ca) return cb-ca; return a.name.localeCompare(b.name,'hr'); }
    var prim=active.filter(function(m){ return m.cat===qa.slot && sel.indexOf(m.id)<0; }).sort(srt);
    var rest=active.filter(function(m){ return m.cat!==qa.slot && sel.indexOf(m.id)<0; }).sort(srt);
    if(prim.length){
      h+='<div class="grp"><div class="grp-l"><i class="tick t-'+qa.slot+'"></i>Tvoj meni · '+SLOT_NAME[qa.slot]+'</div><div class="rows">'
        +prim.map(function(m){ return qaRow(m,st,sel); }).join('')+'</div></div>';
    }
    if(rest.length){
      h+='<div class="grp"><div class="grp-l">Iz ostalih rubrika</div><div class="rows">'
        +rest.map(function(m){ return qaRow(m,st,sel); }).join('')+'</div></div>';
    }
    if(!selMeals.length && !prim.length && !rest.length){
      h+='<div class="nores">Meni je prazan — upiši prvo jelo gore i potvrdi.</div>';
    }
  }
  return h;
}
function refreshQa(){
  var l=$('#qaList'); if(l) l.innerHTML=qaListHtml();
  var hnt=$('#qaHint'); if(hnt) hnt.innerHTML=qaHintHtml();
}
function qaToggle(id){
  var p=ensureDay(qa.date), arr=p[qa.slot], ix=arr.indexOf(id);
  if(ix>=0) arr.splice(ix,1); else arr.push(id);
  pruneDay(qa.date); touch(); refreshQa(); rerender(true);
}
function qaAddExisting(m){
  var p=ensureDay(qa.date);
  if(p[qa.slot].indexOf(m.id)<0){ p[qa.slot].push(m.id); touch(); rerender(true); toast('Dodano: '+m.name); }
  else toast('„'+m.name+'” je već u planu.');
  qaClearInput();
}
function qaCreate(){
  var name=String(qa.q||'').trim();
  if(!name){ var i0=$('#qaInput'); if(i0){ try{ i0.focus(); }catch(e){} } return; }
  var exact=findExact(name);
  if(exact){ qaAddExisting(exact); return; }
  var m={id:uid(),name:name,cat:qa.slot,tags:parseTags(name),created:Date.now()};

function qaClearInput(){

}

function renderStats(){

  var ws=weekStartOf(todayD()), fill=weekFill(ws);
  var top=null, topC=0;

    +[7,14,30].map(function(n){ return '<button data-act="st-win" data-n="'+n+'" class="'+(win===n?'on':'')+'">'+n+' d</button>'; }).join('')
    +'</div></div></div>';
  h+=ruleHtml();

  h+='<div class="stat-cards">';
  h+='<div class="scard"><div class="lab">Ovaj tjedan</div><div class="big num">'+fill+'<small> /21</small></div><div class="sub2">obroka isplanirano</div><div class="mini-track"><div class="mini-fill" data-w="'+Math.round(fill/21*100)+'"></div></div></div>';
  h+='<div class="scard gold"><div class="lab">Najčešće · '+win+' d</div><div class="big num">'+(top?topC+'×':'—')+'</div><div class="sub2">'+(top?esc(top.name):'još nema podataka')+'</div></div>';
  h+='<div class="scard"><div class="lab">Raznolikost · '+win+' d</div><div class="big num">'+st.unique+'</div><div class="sub2">različitih jela na meniju</div></div>';
  h+='</div>';

  var meals=state.meals.filter(function(m){ return st.byMeal[m.id]; })
    .sort(function(a,b){ return st.byMeal[b.id]-st.byMeal[a.id] || a.name.localeCompare(b.name,'hr'); });
  var maxM=meals.length?st.byMeal[meals[0].id]:1;
  h+='<div class="stat-sec"><h3><i class="tick t-r"></i>Jela · zadnjih '+win+' dana</h3>';
  if(meals.length){
    meals.forEach(function(m){
      var c=st.byMeal[m.id];
      h+='<div class="brow"><div class="mid">'
        +'<div class="top"><span class="nm">'+esc(m.name)+'</span><span class="lead"></span><span class="ct num">'+c+'×</span></div>'
        +'<div class="bar"><i data-w="'+Math.round(c/maxM*100)+'"></i></div>'
        +'<div class="last">zadnje: '+relDays(st.last[m.id],tIso)+'</div>'
        +'</div></div>';
    });
  } else h+='<div class="stat-empty">Još nema zapisa u ovom razdoblju. Isplaniraj koji dan pod „Tjedan” i statistika kreće.</div>';
  h+='</div>';

  var tags=Object.keys(st.byTag).sort(function(a,b){ return st.byTag[b]-st.byTag[a] || a.localeCompare(b,'hr'); });
  var maxT=tags.length?st.byTag[tags[0]]:1;
  h+='<div class="stat-sec"><h3><i class="tick t-d"></i>Namirnice · zadnjih '+win+' dana</h3>';
  if(tags.length){
    tags.forEach(function(t){
      var c=st.byTag[t];
      h+='<div class="brow"><div class="mid">'
        +'<div class="top"><span class="nm">'+esc(t)+'</span><span class="lead"></span><span class="ct num">'+c+'×</span></div>'
        +'<div class="bar"><i data-w="'+Math.round(c/maxT*100)+'"></i></div>'
        +'</div></div>';
    });
  } else h+='<div class="stat-empty">Dodaj jelima namirnice (npr. „jaja, sir”) pod „Jela” — ili ih odvoji znakom + u nazivu — pa ovdje prati koliko ih često jedeš.</div>';
  h+='</div>';

  var stale=state.meals.filter(function(m){ return !m.archived; }).map(function(m){
    var last=st.last[m.id]||null;
    return {m:m,last:last,ago:last?diffDays(tIso,last):null};
  }).filter(function(x){ return x.ago===null || x.ago>=10; })
    .sort(function(a,b){ if(a.ago===null&&b.ago===null) return a.m.name.localeCompare(b.m.name,'hr'); if(a.ago===null) return -1; if(b.ago===null) return 1; return b.ago-a.ago; });
  h+='<div class="stat-sec"><h3><i class="tick t-v"></i>Davno nije na meniju</h3>';
  if(stale.length){
    stale.slice(0,10).forEach(function(x){
      h+='<div class="oldrow"><span class="nm">'+esc(x.m.name)+'</span><span class="lead"></span><span class="ago">'+(x.ago===null?'nikad':'prije '+x.ago+' d')+'</span></div>';
    });
  } else h+='<div class="stat-empty">Sve iz tvog menija bilo je na stolu unazad 10 dana — vučja raznolikost.</div>';
  h+='</div>';
  return h;
}

    +'</div><input id="impFile" type="file" accept="application/json,.json" style="display:none">'
    +'<div class="setrow" style="margin-top:10px"><button class="btn btn-d grow" data-act="wipe">Obriši sve podatke</button></div></div>';
  h+='<div class="set-sec"><div class="about-card">'+markSvg('mark')
    +'<div class="n">REVENUE WOLVES</div><div class="s">Meal Planning</div>'
    +'<div class="v">v'+BRAND.ver+' · tjedni planer prehrane</div></div></div>';
  h+='</div>';
  openSheet(h);
  var impF=$('#impFile');
  impF.addEventListener('change',function(){ importFile(impF.files[0]); });
}

/* ---------- export / import / brisanje ---------- */
function exportJson(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='revenue-wolves-plan-'+iso(todayD())+'.json';
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },400);
  toast('Kopija preuzeta.');
}
function importFile(f){
  if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var j=JSON.parse(r.result);
      if(!j||!Array.isArray(j.meals)||typeof j.plan!=='object') throw 0;
      if(!confirm('Učitati kopiju? Ovo zamjenjuje trenutne podatke'+(cfg?' (i na GitHubu nakon sinkronizacije)':'')+'.')) return;
      state=j; state.updatedAt=Date.now();
      saveLocal(); scheduleSync(); closeSheet(); rerender(false);
      toast('Kopija učitana.');
    }catch(e){ toast('Datoteka nije valjana kopija plana.'); }
  };
  r.readAsText(f);
}
function wipeAll(){
  var extra=cfg?'\n\nNakon sinkronizacije bit će prebrisani i podaci na GitHubu.':'';
  if(!confirm('Obrisati SVA jela i cijeli plan?'+extra)) return;
  state=freshState(); maybeSeed(); state.updatedAt=Date.now();
  saveLocal(); scheduleSync(); closeSheet(); rerender(false);
  toast('Podaci obrisani.');
}

/* ---------- GitHub sinkronizacija ---------- */
var GH='https://api.github.com';
var ghSha=null, syncTimer=null, lastPull=0, lastSyncAt=0, pushing=false, dirty=false;

function setStatus(kind,txt){
  var p=$('#syncPill'); if(!p) return;
  p.classList.remove('ok','saving','err');
  if(kind) p.classList.add(kind);
  $('.tx',p).textContent=txt;
}
function refreshStatusIdle(){
  if(!cfg) setStatus('','Poveži');
  else if(dirty) setStatus('saving','Spremam…');
  else setStatus('ok','Sink');
}
function ghHeaders(){
  return { 'Authorization':'Bearer '+cfg.token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
}
function b64e(str){
  var b=new TextEncoder().encode(str), s='';
  for(var i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000));
  return btoa(s);
}
function b64d(b64){
  var bin=atob(b64.replace(/\s/g,'')), a=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(a);
}
function ghUrl(){ return GH+'/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/'); }

function ghGet(){
  return fetch(ghUrl()+'?ref='+encodeURIComponent(cfg.branch||'main'),{headers:ghHeaders(),cache:'no-store'})
    .then(function(res){
      if(res.status===404) return null;
      if(res.status===401||res.status===403) throw {auth:true};
      if(!res.ok) throw {status:res.status};
      return res.json().then(function(j){
        var data=null;
        try{ data=JSON.parse(b64d(j.content)); }catch(e){}
        return {sha:j.sha, data:data};
      });
    });
}
function ghPut(sha){
  var body={ message:'meal-plan · '+new Date().toISOString(), content:b64e(JSON.stringify(state,null,2)), branch:cfg.branch||'main' };
  if(sha) body.sha=sha;
  return fetch(ghUrl(),{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},ghHeaders()),body:JSON.stringify(body)})
    .then(function(res){
      if(res.status===401||res.status===403) throw {auth:true};
      if(res.status===409||res.status===422) throw {conflict:true};
      if(!res.ok) throw {status:res.status};
      return res.json();
    });
}
function scheduleSync(){
  dirty=true;
  if(!cfg){ refreshStatusIdle(); return; }
  setStatus('saving','Spremam…');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(pushRemote,1400);
}
function pushRemote(){
  if(!cfg||pushing) return;
  pushing=true;
  ghPut(ghSha).then(function(j){
    ghSha=(j.content&&j.content.sha)||ghSha;
    dirty=false; pushing=false; lastSyncAt=Date.now();
    setStatus('ok','Sink');
  }).catch(function(err){
    pushing=false;
    if(err&&err.conflict){
      ghGet().then(function(rem){
        if(rem){ ghSha=rem.sha;
          if(rem.data && rem.data.updatedAt>state.updatedAt){
            state=rem.data; saveLocal(); dirty=false; rerender(true); lastSyncAt=Date.now();
            setStatus('ok','Sink'); toast('Preuzete novije promjene s drugog uređaja.');
          } else pushRemote();
        } else pushRemote();
      }).catch(function(){ setStatus('err','Greška'); });
    } else if(err&&err.auth){
      setStatus('err','Token?'); toast('GitHub token nije valjan ili je istekao. Provjeri u Postavkama.');
    } else {
      setStatus('err','Offline'); toast('Nema veze — promjene su spremljene lokalno.');
    }
  });
}
function pullRemote(silent){
  if(!cfg) return Promise.resolve();
  lastPull=Date.now();
  if(!silent) setStatus('saving','Sink…');
  return ghGet().then(function(rem){
    if(!rem){ ghSha=null; return pushRemote(); }
    ghSha=rem.sha;
    if(rem.data && typeof rem.data==='object' && Array.isArray(rem.data.meals)){
      if((rem.data.updatedAt||0)>(state.updatedAt||0)){
        state=rem.data; saveLocal(); rerender(true);
      } else if((state.updatedAt||0)>(rem.data.updatedAt||0)){
        return pushRemote();
      }
    }
    dirty=false; lastSyncAt=Date.now(); setStatus('ok','Sink');
  }).catch(function(err){
    if(err&&err.auth){ setStatus('err','Token?'); if(!silent) toast('GitHub token nije valjan ili je istekao.'); }
    else { setStatus('err','Offline'); if(!silent) toast('Ne mogu dohvatiti podatke s GitHuba.'); }
  });
}
function connectGithub(){
  var owner=$('#gOwner').value.trim(), repo=$('#gRepo').value.trim(), token=$('#gToken').value.trim();
  var branch=($('#gBranch')?$('#gBranch').value.trim():'main')||'main';
  var path=($('#gPath')?$('#gPath').value.trim():'data.json')||'data.json';
  if(!owner||!repo||!token){ toast('Ispuni korisničko ime, repozitorij i token.'); return; }
  cfg={owner:owner,repo:repo,branch:branch,path:path,token:token};
  saveCfg(); ghSha=null;
  setStatus('saving','Sink…');
  pullRemote().then(function(){
    if(!$('#syncPill').classList.contains('err')){ closeSheet(); toast('Povezano — podaci se sinkroniziraju s GitHubom.'); }
  });
}
function disconnectGithub(){
  cfg=null; saveCfg(); ghSha=null; dirty=false;
  refreshStatusIdle(); closeSheet();
  toast('Odspojen. Podaci ostaju spremljeni lokalno.');
}

/* ---------- dobrodošlica ---------- */
function maybeWelcome(){
  if(ui.welcomed) return;
  $('#welcome').innerHTML='<div class="wel">'
    +markSvg('mark')
    +'<h2>Dobrodošao u čopor</h2>'
    +ruleHtml()
    +'<p><b>Tjedan</b> — dodirni doručak, ručak ili večeru bilo kojeg dana i odmah upiši jelo. Sprema se samo u tu rubriku, spremno za sljedeći put.</p>'
    +'<p><b>Jela</b> — tvoj meni po rubrikama. Znak + u nazivu (npr. „jaja + sir”) sam izvuče namirnice, a statistika ih prati kroz sva jela.</p>'
    +'<p><b>Sinkronizacija</b> — u Postavkama poveži GitHub repozitorij i plan je isti na iPhoneu i Macu, s poviješću svake promjene.</p>'
    +'<button class="btn btn-p" data-act="wel-go">Kreni</button></div>';
  $('#welcome').classList.add('open');
}

/* ---------- toast ---------- */
var toastT=null;
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2400);
}

/* ---------- meni tjedna ---------- */
function openWeekMenu(){
  var h='<div class="grab"></div>';
  h+='<div class="p-head"><div class="tt"><h2>Tjedan</h2><div class="sub">'+esc(weekRangeLabel(weekStart))+'</div></div><button class="iconbtn" data-act="sheet-x" aria-label="Zatvori">'+I.x.replace('<svg','<svg class="ic"')+'</button></div>';
  h+='<div class="p-body" style="padding-bottom:22px"><div class="setrow" style="flex-direction:column">';
  h+='<button class="btn btn-g" style="justify-content:flex-start" data-act="wk-copy">Kopiraj prošli tjedan u prazna polja</button>';
  h+='<button class="btn btn-d" style="justify-content:flex-start" data-act="wk-clear">Isprazni ovaj tjedan</button>';
  h+='</div></div>';
  openSheet(h);
}
function copyPrevWeek(){
  var n=0;
  for(var i=0;i<7;i++){
    var dst=iso(addD(weekStart,i)), src=iso(addD(weekStart,i-7));
    var sp=state.plan[src]; if(!sp) continue;
    ['d','r','v'].forEach(function(k){
      var items=(sp[k]||[]).filter(function(id){ var m=mealById(id); return m&&!m.archived; });
      if(items.length){ var dp=ensureDay(dst); if(!dp[k].length){ dp[k]=items.slice(); n+=items.length; } }
    });
  }
  if(n){ touch(); rerender(true); toast('Kopirano iz prošlog tjedna.'); }
  else toast('Nema što kopirati — polja su puna ili je prošli tjedan prazan.');
  closeSheet();
}
function clearWeek(){
  if(!confirm('Isprazniti sva tri obroka za svih 7 dana ovog tjedna?')) return;
  for(var i=0;i<7;i++) delete state.plan[iso(addD(weekStart,i))];
  touch(); closeSheet(); rerender(true); toast('Tjedan ispražnjen.');
}

/* ---------- globalni događaji ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el) return;
  var a=el.dataset.act;
  switch(a){
    case 'nav': showView(el.dataset.v); break;
    case 'settings': openSettings(); break;
    case 'wk-prev': weekStart=addD(weekStart,-7); rerender(false); break;
    case 'wk-next': weekStart=addD(weekStart,7); rerender(false); break;
    case 'wk-today': weekStart=weekStartOf(todayD()); scrollToTodayFlag=true; rerender(false); break;
    case 'wk-menu': openWeekMenu(); break;
    case 'wk-copy': copyPrevWeek(); break;
    case 'wk-clear': clearWeek(); break;
    case 'slot': openPicker(el.dataset.date, el.dataset.slot); break;
    case 'entry-x': e.stopPropagation();
      (function(){ var p=ensureDay(el.dataset.date); p[el.dataset.slot]=p[el.dataset.slot].filter(function(x){ return x!==el.dataset.id; }); pruneDay(el.dataset.date); touch(); rerender(true); })();
      break;
    case 'qa-t': qaToggle(el.dataset.id); break;
    case 'qa-create': qaCreate(); break;
    case 'sheet-x': closeSheet(); break;
    case 'lib-new': openEditor(null); break;
    case 'lib-edit': openEditor(el.dataset.id); break;
    case 'lib-restore':
      (function(){ var m=mealById(el.dataset.id); if(m){ delete m.archived; touch(); rerender(true); toast('Vraćeno: '+m.name); } })();
      break;
    case 'arch-t': ui.archOpen=!ui.archOpen; saveUi(); rerender(true); break;
    case 'ed-save': saveEditor(); break;
    case 'ed-del': deleteEditor(); break;
    case 'st-win': ui.statsWin=+el.dataset.n; saveUi(); rerender(true); break;
    case 'gh-save': connectGithub(); break;
    case 'gh-off': disconnectGithub(); break;
    case 'exp': exportJson(); break;
    case 'imp': $('#impFile').click(); break;
    case 'wipe': wipeAll(); break;
    case 'wel-go': ui.welcomed=true; saveUi(); $('#welcome').classList.remove('open'); break;
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && sheetOpenFlag) closeSheet();
  if(e.key==='Enter' && e.target && e.target.id==='edName'){ e.preventDefault(); saveEditor(); }
});
document.addEventListener('keyup',function(e){
  if((e.key==='Enter'||e.key===' ') && e.target && e.target.classList && e.target.classList.contains('slot')){
    openPicker(e.target.dataset.date, e.target.dataset.slot);
  }
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible' && cfg && Date.now()-lastPull>60000) pullRemote(true);
});
window.addEventListener('online',function(){ if(cfg&&dirty) pushRemote(); });

/* ---------- start ---------- */
function init(){
  loadAll();
  curView=(ui.view==='lib'||ui.view==='stats')?ui.view:'week';
  rerender(false);
  refreshStatusIdle();
  maybeWelcome();
  var sp=$('#splash');
  setTimeout(function(){ sp.classList.add('hide'); setTimeout(function(){ try{ sp.remove(); }catch(e){} },520); },460);
  if(cfg) pullRemote(true);
}
window.WF={ get state(){return state;}, showView:showView, openPicker:openPicker, rerender:rerender, statsFor:statsFor, toast:toast };
init();

</script>
